<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONNECT 2026 - 관리자 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: #f8fafc; 
            letter-spacing: -0.02em; 
            overflow-x: hidden; 
        }
        .font-impact { font-weight: 800; letter-spacing: -0.05em; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .tab-active { @apply bg-indigo-600 text-white shadow-lg; }
        .tab-inactive { @apply bg-white text-slate-400 hover:bg-slate-50; }
    </style>
</head>
<body class="min-h-screen text-left">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass border-b border-slate-200 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center text-left">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <span class="text-xl font-impact text-slate-900 uppercase">Admin Portal</span>
            </div>
            <div class="flex items-center gap-4 text-left">
                <span id="userDisplay" class="text-sm font-medium text-slate-600 hidden md:block">로그인 확인 중...</span>
                <div class="w-10 h-10 rounded-full bg-slate-200 border-2 border-white shadow-sm overflow-hidden text-center text-center">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="avatar">
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8 text-left">
        <!-- Header & Action -->
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-6 text-left">
            <div>
                <h2 class="text-3xl font-800 text-slate-900 font-impact mb-2 uppercase text-left italic">DASHBOARD OVERVIEW</h2>
                <p class="text-slate-500 font-bold text-left text-left">실시간 학생 지원 현황 및 프로젝트 통계를 관리합니다.</p>
            </div>
            <div class="flex flex-wrap gap-3 text-left">
                <!-- 탭 전환 버튼 -->
                <div class="flex bg-white rounded-xl p-1 shadow-sm border border-slate-200 mr-2">
                    <button id="viewActiveBtn" onclick="toggleView('active')" class="px-4 py-2 rounded-lg text-sm font-bold transition-all tab-active">
                        <i class="fas fa-list-ul mr-2"></i>지원 목록
                    </button>
                    <button id="viewTrashBtn" onclick="toggleView('trash')" class="px-4 py-2 rounded-lg text-sm font-bold transition-all tab-inactive">
                        <i class="fas fa-trash-alt mr-2"></i>휴지통
                    </button>
                </div>
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-bold transition-all flex items-center gap-2 shadow-lg shadow-emerald-100 text-center">
                    <i class="fas fa-file-excel"></i>
                    <span>엑셀 다운로드</span>
                </button>
                <div class="relative text-left">
                    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="이름 또는 테마 검색..." 
                           class="pl-11 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl w-64 focus:ring-2 focus:ring-indigo-500 transition-all outline-none text-sm font-bold text-left">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10 text-left">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 card-hover text-left">
                <div class="flex justify-between items-start mb-4">
                    <div class="w-12 h-12 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-600 text-xl text-center text-center"><i class="fas fa-users text-center"></i></div>
                    <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-lg">TOTAL</span>
                </div>
                <h3 class="text-slate-500 text-sm font-medium mb-1">전체 신청수</h3>
                <p id="totalCount" class="text-3xl font-800 text-slate-900 font-impact">0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 card-hover text-left">
                <div class="flex justify-between items-start mb-4 text-left text-left">
                    <div class="w-12 h-12 bg-rose-50 rounded-xl flex items-center justify-center text-rose-600 text-xl text-center text-center"><i class="fas fa-bolt text-center text-center"></i></div>
                    <span class="text-xs font-bold text-rose-600 bg-rose-50 px-2 py-1 rounded-lg">TODAY</span>
                </div>
                <h3 class="text-slate-500 text-sm font-medium mb-1">오늘 신규</h3>
                <p id="todayCount" class="text-3xl font-800 text-slate-900 font-impact text-left text-left">0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 card-hover text-left text-left text-left">
                <div class="flex justify-between items-start mb-4 text-left text-left text-left">
                    <div class="w-12 h-12 bg-amber-50 rounded-xl flex items-center justify-center text-amber-600 text-xl text-center text-center text-center"><i class="fas fa-star text-center text-center text-center"></i></div>
                    <span class="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-lg">HOT</span>
                </div>
                <h3 class="text-slate-500 text-sm font-medium mb-1 text-left text-left text-left">인기 테마</h3>
                <p id="popularTheme" class="text-xl font-800 text-slate-900 truncate text-left text-left text-left">-</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 card-hover text-left text-left text-left text-left">
                <div class="flex justify-between items-start mb-4 text-left text-left text-left text-left">
                    <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-600 text-xl text-center text-center text-center text-center text-center text-center"><i class="fas fa-check-double text-center"></i></div>
                    <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg uppercase text-center text-center text-center text-center text-center text-center">Status</span>
                </div>
                <h3 class="text-slate-500 text-sm font-medium mb-1 text-left text-left text-left text-left text-left text-left">연결 상태</h3>
                <p class="text-xl font-800 text-emerald-600 text-left text-left text-left text-left text-left text-left">정상 작동중</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden text-left">
            <div class="px-8 py-6 border-b border-slate-50 flex items-center justify-between text-left">
                <h3 id="tableTitle" class="text-xl font-800 text-slate-900 font-impact italic uppercase">PROPOSAL ARCHIVES</h3>
                <div class="flex items-center gap-2 text-left">
                    <div class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse text-left text-left text-left text-left"></div>
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest text-left text-left text-left text-left">Real-time Feed</span>
                </div>
            </div>
            <div class="overflow-x-auto custom-scroll text-left text-left text-left text-left text-left text-left text-left text-left">
                <table class="w-full text-left border-collapse text-left text-left text-left text-left text-left text-left text-left">
                    <thead>
                        <tr class="bg-slate-50/50 text-slate-400 text-[11px] uppercase tracking-wider font-bold text-left">
                            <th class="px-8 py-4 border-b text-left">신청 일시</th>
                            <th class="px-8 py-4 border-b text-left">지원자 정보</th>
                            <th class="px-8 py-4 border-b text-left">선택 테마</th>
                            <th class="px-8 py-4 border-b text-left text-left text-left text-left text-left text-left text-left">기획안 상세</th>
                            <th class="px-8 py-4 border-b text-right">관리</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable" class="divide-y divide-slate-50 text-left text-left text-left text-left text-left text-left text-left">
                        <!-- Data injected here -->
                    </tbody>
                </table>
            </div>
            <div id="loading" class="py-20 flex flex-col items-center justify-center text-slate-400 text-center text-center text-center text-center text-center text-center text-center">
                <div class="w-10 h-10 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin mb-4 text-center text-center text-center text-center text-center text-center text-center"></div>
                <p class="text-sm font-medium">데이터를 불러오는 중입니다...</p>
            </div>
        </div>
    </main>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-8 right-8 hidden items-center gap-3 bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl animate-bounce text-center text-center text-center text-center text-center text-center">
        <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center text-center text-center text-center text-center text-center text-center text-center">
            <i class="fas fa-bell text-center text-center text-center text-center text-center text-center text-center"></i>
        </div>
        <div class="text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left">
            <p id="toastTitle" class="text-sm font-bold text-left">데이터 동기화!</p>
            <p id="toastMsg" class="text-xs text-slate-400 text-left text-left">신청서 목록이 실시간으로 갱신되었습니다.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, onSnapshot, doc, deleteDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Happylife-0301 Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyBCC_ZKDOKVWagnRdxyXMibEK4-tQVx5EI",
            authDomain: "happylife-0301.firebaseapp.com",
            projectId: "happylife-0301",
            storageBucket: "happylife-0301.firebasestorage.app",
            messagingSenderId: "50842617524",
            appId: "1:50842617524:web:868086900262ec9243b9e1",
            measurementId: "G-CVWZKNZ8E5"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'connect-2026';

        let allProposals = [];
        let firstLoad = true;
        let currentView = 'active'; // 'active' 또는 'trash'

        const init = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try { await signInWithCustomToken(auth, __initial_auth_token); } 
                    catch { await signInAnonymously(auth); }
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) { console.error("Auth failed", err); }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    document.getElementById('userDisplay').innerText = `Admin Access: ${user.uid.substring(0, 6)}`;
                    startListening();
                }
            });
        };

        function startListening() {
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'proposals'));
            onSnapshot(q, (snapshot) => {
                allProposals = [];
                snapshot.forEach(doc => allProposals.push({ id: doc.id, ...doc.data() }));
                
                // 최신순 정렬
                allProposals.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                
                renderCurrentView();
                updateStats(allProposals.filter(p => !p.isDeleted));
                
                document.getElementById('loading').style.display = 'none';
                if (!firstLoad) showToast("데이터 업데이트", "신청서 목록이 실시간으로 갱신되었습니다.");
                firstLoad = false;
            }, (error) => console.error("Firestore Error:", error));
        }

        // 보기 모드 전환
        window.toggleView = (view) => {
            currentView = view;
            const activeBtn = document.getElementById('viewActiveBtn');
            const trashBtn = document.getElementById('viewTrashBtn');
            const tableTitle = document.getElementById('tableTitle');

            if (view === 'active') {
                activeBtn.className = "px-4 py-2 rounded-lg text-sm font-bold transition-all tab-active";
                trashBtn.className = "px-4 py-2 rounded-lg text-sm font-bold transition-all tab-inactive";
                tableTitle.innerText = "PROPOSAL ARCHIVES";
            } else {
                activeBtn.className = "px-4 py-2 rounded-lg text-sm font-bold transition-all tab-inactive";
                trashBtn.className = "px-4 py-2 rounded-lg text-sm font-bold transition-all tab-active";
                tableTitle.innerText = "TRASH CAN (DELETED)";
            }
            renderCurrentView();
        };

        // 삭제(휴지통으로 이동)
        window.deleteProposal = async (id) => {
            if (!confirm("이 지원서를 휴지통으로 이동하시겠습니까?")) return;
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'proposals', id), {
                    isDeleted: true,
                    deletedAt: serverTimestamp()
                });
                showToast("삭제 완료", "지원서가 휴지통으로 이동되었습니다.");
            } catch (error) { alert("오류 발생: " + error.message); }
        };

        // 복구
        window.restoreProposal = async (id) => {
            if (!confirm("이 지원서를 다시 복구하시겠습니까?")) return;
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'proposals', id), {
                    isDeleted: false,
                    deletedAt: null
                });
                showToast("복구 완료", "지원서가 목록으로 복구되었습니다.");
            } catch (error) { alert("오류 발생: " + error.message); }
        };

        // 영구 삭제
        window.permanentDeleteProposal = async (id) => {
            if (!confirm("정말 영구 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'proposals', id));
                showToast("영구 삭제 완료", "데이터가 데이터베이스에서 완전히 삭제되었습니다.");
            } catch (error) { alert("오류 발생: " + error.message); }
        };

        function renderCurrentView() {
            const tbody = document.getElementById('dataTable');
            const items = currentView === 'active' 
                ? allProposals.filter(p => !p.isDeleted) 
                : allProposals.filter(p => p.isDeleted);

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-16 text-center text-slate-400 font-bold italic text-sm">내역이 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = items.map(item => {
                const dateStr = item.timestamp ? new Date(item.timestamp.seconds * 1000).toLocaleString('ko-KR') : '-';
                const actionButtons = currentView === 'active' 
                    ? `<button onclick="deleteProposal('${item.id}')" class="w-9 h-9 rounded-lg bg-rose-50 text-rose-500 hover:bg-rose-500 hover:text-white transition-all shadow-sm flex items-center justify-center ml-auto"><i class="fas fa-trash-alt"></i></button>`
                    : `<div class="flex gap-2 justify-end">
                        <button onclick="restoreProposal('${item.id}')" class="w-9 h-9 rounded-lg bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white transition-all shadow-sm flex items-center justify-center" title="복구"><i class="fas fa-undo"></i></button>
                        <button onclick="permanentDeleteProposal('${item.id}')" class="w-9 h-9 rounded-lg bg-slate-100 text-slate-400 hover:bg-slate-600 hover:text-white transition-all shadow-sm flex items-center justify-center" title="영구 삭제"><i class="fas fa-times"></i></button>
                      </div>`;

                return `
                    <tr class="hover:bg-indigo-50/20 transition-colors group text-left">
                        <td class="px-8 py-5">
                            <div class="flex flex-col text-left">
                                <span class="text-xs font-bold text-slate-400 mb-1">DATE</span>
                                <span class="text-sm text-slate-600 font-bold">${dateStr}</span>
                            </div>
                        </td>
                        <td class="px-8 py-5 text-left">
                            <div class="flex items-center gap-3 text-left">
                                <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 text-center"><i class="fas fa-user text-xs"></i></div>
                                <span class="font-bold text-slate-700">${item.stuName || '익명'}</span>
                            </div>
                        </td>
                        <td class="px-8 py-5 text-left">
                            <span class="px-3 py-1 rounded-full bg-indigo-50 text-indigo-600 text-[11px] font-bold text-left">
                                ${item.theme || '-'}
                            </span>
                        </td>
                        <td class="px-8 py-5 text-left">
                            <div class="max-w-lg">
                                <p class="text-sm text-slate-600 whitespace-pre-wrap leading-relaxed text-left">${item.content || '내용 없음'}</p>
                            </div>
                        </td>
                        <td class="px-8 py-5 text-right">
                            ${actionButtons}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateStats(activeItems) {
            document.getElementById('totalCount').innerText = activeItems.length;
            const startOfToday = new Date().setHours(0,0,0,0);
            const todayCount = activeItems.filter(item => (item.timestamp?.seconds * 1000) >= startOfToday).length;
            document.getElementById('todayCount').innerText = todayCount;

            if (activeItems.length > 0) {
                const themeCounts = {};
                activeItems.forEach(i => { if(i.theme) themeCounts[i.theme] = (themeCounts[i.theme] || 0) + 1; });
                const popular = Object.keys(themeCounts).reduce((a, b) => themeCounts[a] > themeCounts[b] ? a : b, "-");
                document.getElementById('popularTheme').innerText = popular;
            }
        }

        window.exportToExcel = () => {
            const activeItems = allProposals.filter(p => !p.isDeleted);
            if (activeItems.length === 0) return alert("다운로드할 데이터가 없습니다.");
            const excelRows = activeItems.map(item => ({
                "신청일시": item.timestamp ? new Date(item.timestamp.seconds * 1000).toLocaleString('ko-KR') : '-',
                "지원자": item.stuName || '익명',
                "테마": item.theme || '미분류',
                "기획내용": item.content || '-'
            }));
            const worksheet = XLSX.utils.json_to_sheet(excelRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Proposals");
            XLSX.writeFile(workbook, `CONNECT2026_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
        };

        window.filterTable = () => {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const rows = document.querySelectorAll("#dataTable tr");
            rows.forEach(row => { row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none"; });
        };

        function showToast(title, msg) {
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMsg').innerText = msg;
            const toast = document.getElementById('toast');
            toast.classList.replace('hidden', 'flex');
            setTimeout(() => toast.classList.replace('flex', 'hidden'), 3000);
        }

        init();
    </script>
</body>
</html>
