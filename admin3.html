<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONNECT 2026 - 관리자 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: #f8fafc; 
            letter-spacing: -0.02em; 
            overflow-x: hidden; 
        }
        .font-impact { font-weight: 800; letter-spacing: -0.05em; }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        
        /* 모바일 테이블 최적화 */
        @media (max-width: 768px) {
            .mobile-stack { flex-direction: column; align-items: flex-start; }
            .mobile-full { width: 100%; }
        }
    </style>
</head>
<body class="min-h-screen text-left">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass border-b border-slate-200 px-4 md:px-6 py-3 md:py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white">
                    <i class="fas fa-shield-halved text-sm"></i>
                </div>
                <span class="text-lg md:text-xl font-impact text-slate-900 uppercase tracking-tighter">Admin Portal</span>
            </div>
            <div class="flex items-center gap-3">
                <span id="userDisplay" class="text-[11px] md:text-sm font-medium text-slate-500 hidden sm:block">연결 대기 중...</span>
                <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-slate-200 border-2 border-white shadow-sm overflow-hidden">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="avatar">
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 md:px-6 py-6 md:py-8 text-left">
        <!-- Header & Action -->
        <div class="flex flex-col lg:flex-row lg:items-end justify-between mb-8 md:mb-10 gap-6">
            <div class="text-left">
                <h2 class="text-2xl md:text-3xl font-800 text-slate-900 font-impact mb-2 uppercase italic leading-tight">DASHBOARD<br class="block md:hidden"> OVERVIEW</h2>
                <p class="text-slate-500 font-bold text-sm md:text-base">실시간 학생 지원 현황 및 프로젝트 통계</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="exportToExcel()" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-xl font-bold transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-100 text-sm">
                    <i class="fas fa-file-excel"></i>
                    <span>엑셀 다운로드</span>
                </button>
                <div class="relative w-full sm:w-64">
                    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="이름 또는 테마 검색..." 
                           class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all outline-none text-sm font-bold">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mb-8 md:mb-10">
            <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-100 card-hover text-left">
                <div class="flex justify-between items-start mb-3 md:mb-4">
                    <div class="w-10 h-10 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-600 text-lg"><i class="fas fa-users"></i></div>
                    <span class="text-[9px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">TOTAL</span>
                </div>
                <h3 class="text-slate-400 text-[10px] md:text-xs font-bold mb-1 uppercase">전체 신청</h3>
                <p id="totalCount" class="text-2xl md:text-3xl font-800 text-slate-900 font-impact">0</p>
            </div>
            <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-100 card-hover text-left">
                <div class="flex justify-between items-start mb-3 md:mb-4">
                    <div class="w-10 h-10 bg-rose-50 rounded-xl flex items-center justify-center text-rose-600 text-lg"><i class="fas fa-bolt"></i></div>
                    <span class="text-[9px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-md">TODAY</span>
                </div>
                <h3 class="text-slate-400 text-[10px] md:text-xs font-bold mb-1 uppercase">오늘 신규</h3>
                <p id="todayCount" class="text-2xl md:text-3xl font-800 text-slate-900 font-impact">0</p>
            </div>
            <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-100 card-hover text-left">
                <div class="flex justify-between items-start mb-3 md:mb-4">
                    <div class="w-10 h-10 bg-amber-50 rounded-xl flex items-center justify-center text-amber-600 text-lg"><i class="fas fa-star"></i></div>
                    <span class="text-[9px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-md">HOT</span>
                </div>
                <h3 class="text-slate-400 text-[10px] md:text-xs font-bold mb-1 uppercase">인기 테마</h3>
                <p id="popularTheme" class="text-sm md:text-base font-800 text-slate-900 truncate">-</p>
            </div>
            <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-100 card-hover text-left">
                <div class="flex justify-between items-start mb-3 md:mb-4">
                    <div class="w-10 h-10 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-600 text-lg"><i class="fas fa-check-double"></i></div>
                    <span class="text-[9px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md uppercase">Sync</span>
                </div>
                <h3 class="text-slate-400 text-[10px] md:text-xs font-bold mb-1 uppercase">서버 상태</h3>
                <p class="text-sm md:text-base font-800 text-emerald-600">실시간 연동중</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="bg-white rounded-2xl md:rounded-3xl shadow-sm border border-slate-100 overflow-hidden text-left">
            <div class="px-6 py-5 border-b border-slate-50 flex items-center justify-between text-left">
                <h3 class="text-lg md:text-xl font-800 text-slate-900 font-impact italic uppercase">PROPOSAL ARCHIVES</h3>
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest hidden sm:inline">Live Feed</span>
                </div>
            </div>
            
            <div class="overflow-x-auto custom-scroll">
                <table class="w-full text-left border-collapse min-w-[700px]">
                    <thead>
                        <tr class="bg-slate-50/50 text-slate-400 text-[10px] md:text-[11px] uppercase tracking-wider font-bold">
                            <th class="px-6 py-4 border-b w-32">신청 일시</th>
                            <th class="px-6 py-4 border-b w-40">지원자 정보</th>
                            <th class="px-6 py-4 border-b w-32">선택 테마</th>
                            <th class="px-6 py-4 border-b">기획안 상세 (동기 및 계획)</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable" class="divide-y divide-slate-50 text-left">
                        <!-- Data injected here -->
                    </tbody>
                </table>
            </div>
            
            <div id="loading" class="py-16 md:py-20 flex flex-col items-center justify-center text-slate-400 text-center">
                <div class="w-8 h-8 md:w-10 md:h-10 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
                <p class="text-xs md:text-sm font-medium">데이터를 실시간으로 연동 중입니다...</p>
            </div>
        </div>
    </main>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 left-6 sm:left-auto sm:w-80 hidden items-center gap-3 bg-slate-900 text-white px-5 py-4 rounded-2xl shadow-2xl animate-bounce text-center z-[100]">
        <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center flex-shrink-0">
            <i class="fas fa-bell text-sm"></i>
        </div>
        <div class="text-left">
            <p class="text-xs md:text-sm font-bold">새로운 데이터 도착!</p>
            <p class="text-[10px] md:text-xs text-slate-400">대시보드가 업데이트되었습니다.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 설정 (Happylife-0301)
        const defaultFirebaseConfig = {
            apiKey: "AIzaSyBCC_ZKDOKVWagnRdxyXMibEK4-tQVx5EI",
            authDomain: "happylife-0301.firebaseapp.com",
            projectId: "happylife-0301",
            storageBucket: "happylife-0301.firebasestorage.app",
            messagingSenderId: "50842617524",
            appId: "1:50842617524:web:868086900262ec9243b9e1",
            measurementId: "G-CVWZKNZ8E5"
        };

        const firebaseConfig = {
  apiKey: "AIzaSyBCC_ZKDOKVWagnRdxyXMibEK4-tQVx5EI",
  authDomain: "happylife-0301.firebaseapp.com",
  projectId: "happylife-0301",
  storageBucket: "happylife-0301.firebasestorage.app",
  messagingSenderId: "50842617524",
  appId: "1:50842617524:web:868086900262ec9243b9e1",
  measurementId: "G-CVWZKNZ8E5"
};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'connect-2026';

        let currentProposals = [];
        let firstLoad = true;

        const init = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try { await signInWithCustomToken(auth, __initial_auth_token); } 
                    catch { await signInAnonymously(auth); }
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) { console.error("Auth failed", err); }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    document.getElementById('userDisplay').innerText = `Admin Access: ${user.uid.substring(0, 6)}`;
                    startListening();
                }
            });
        };

        function startListening() {
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'proposals'));
            onSnapshot(q, (snapshot) => {
                const items = [];
                snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                items.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                
                currentProposals = items;
                renderTable(items);
                updateStats(items);
                document.getElementById('loading').style.display = 'none';
                if (!firstLoad) showToast();
                firstLoad = false;
            }, (error) => console.error("Firestore Error:", error));
        }

        function renderTable(items) {
            const tbody = document.getElementById('dataTable');
            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-12 text-center text-slate-300 font-bold italic text-sm">접수된 내역이 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = items.map(item => {
                const dateStr = item.timestamp ? new Date(item.timestamp.seconds * 1000).toLocaleString('ko-KR', {
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                }) : '-';
                return `
                    <tr class="hover:bg-indigo-50/20 transition-colors group text-left">
                        <td class="px-6 py-4">
                            <span class="text-[10px] font-bold text-slate-400 block mb-0.5">TIME</span>
                            <span class="text-xs text-slate-600 font-bold">${dateStr}</span>
                        </td>
                        <td class="px-6 py-4">
                            <span class="font-bold text-slate-700 text-sm block">${item.stuName || '익명'}</span>
                        </td>
                        <td class="px-6 py-4">
                            <span class="inline-block px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-600 text-[10px] font-bold">
                                ${item.theme || '미분류'}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-left">
                            <div class="max-w-xs sm:max-w-sm md:max-w-md lg:max-w-xl">
                                <p class="text-xs md:text-sm text-slate-500 whitespace-pre-wrap leading-relaxed line-clamp-2 group-hover:line-clamp-none transition-all">${item.content || '내용 없음'}</p>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateStats(items) {
            document.getElementById('totalCount').innerText = items.length;
            const startOfToday = new Date().setHours(0,0,0,0);
            const todayCount = items.filter(item => (item.timestamp?.seconds * 1000) >= startOfToday).length;
            document.getElementById('todayCount').innerText = todayCount;

            if (items.length > 0) {
                const counts = {};
                items.forEach(i => { if(i.theme) counts[i.theme] = (counts[i.theme] || 0) + 1; });
                const popular = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b, "-");
                document.getElementById('popularTheme').innerText = popular;
            }
        }

        window.exportToExcel = () => {
            if (currentProposals.length === 0) return alert("데이터가 없습니다.");
            const excelRows = currentProposals.map(item => ({
                "신청일시": item.timestamp ? new Date(item.timestamp.seconds * 1000).toLocaleString('ko-KR') : '-',
                "학생명": item.stuName || '익명',
                "테마": item.theme || '미분류',
                "기획내용": item.content || '-'
            }));
            const worksheet = XLSX.utils.json_to_sheet(excelRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "SupportList");
            XLSX.writeFile(workbook, `CONNECT_2026_지원현황_${new Date().toISOString().slice(0,10)}.xlsx`);
        };

        window.filterTable = () => {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const rows = document.querySelectorAll("#dataTable tr");
            rows.forEach(row => { row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none"; });
        };

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 3000);
        }

        init();
    </script>
</body>
</html>
