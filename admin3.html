<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONNECT 2026 - 관리자 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: #f8fafc; 
            letter-spacing: -0.02em; 
            overflow-x: hidden; 
        }
        .font-impact { font-weight: 800; letter-spacing: -0.05em; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="min-h-screen text-left">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass border-b border-slate-200 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center text-left">
            <div class="flex items-center gap-2 text-left">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <span class="text-xl font-impact text-slate-900 uppercase">Admin Portal</span>
            </div>
            <div class="flex items-center gap-4 text-left">
                <span id="userDisplay" class="text-sm font-medium text-slate-600 hidden md:block">로그인 확인 중...</span>
                <div class="w-10 h-10 rounded-full bg-slate-200 border-2 border-white shadow-sm overflow-hidden text-center">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="avatar">
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8 text-left">
        <!-- Header & Action -->
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-6 text-left">
            <div class="text-left">
                <h2 class="text-3xl font-800 text-slate-900 font-impact mb-2 uppercase italic text-left">DASHBOARD OVERVIEW</h2>
                <p class="text-slate-500 font-bold">실시간 학생 지원 현황 및 프로젝트 통계를 관리합니다.</p>
            </div>
            <div class="flex gap-3 text-left">
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-bold transition-all flex items-center gap-2 shadow-lg shadow-emerald-100 text-center">
                    <i class="fas fa-file-excel"></i>
                    <span>엑셀 다운로드</span>
                </button>
                <div class="relative text-left">
                    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="이름 또는 테마 검색..." 
                           class="pl-11 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl w-64 focus:ring-2 focus:ring-indigo-500 transition-all outline-none text-sm font-bold">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10 text-left">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 card-hover text-left">
                <div class="flex justify-between items-start mb-4 text-left">
                    <div class="w-12 h-12 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-600 text-xl"><i class="fas fa-users"></i></div>
                    <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-lg">TOTAL</span>
                </div>
                <h3 class="text-slate-500 text-sm font-medium mb-1">전체 신청수</h3>
                <p id="totalCount" class="text-3xl font-800 text-slate-900 font-impact text-left">0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 card-hover text-left">
                <div class="flex justify-between items-start mb-4">
                    <div class="w-12 h-12 bg-rose-50 rounded-xl flex items-center justify-center text-rose-600 text-xl"><i class="fas fa-bolt"></i></div>
                    <span class="text-xs font-bold text-rose-600 bg-rose-50 px-2 py-1 rounded-lg">TODAY</span>
                </div>
                <h3 class="text-slate-500 text-sm font-medium mb-1">오늘 신규</h3>
                <p id="todayCount" class="text-3xl font-800 text-slate-900 font-impact text-left">0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 card-hover text-left">
                <div class="flex justify-between items-start mb-4">
                    <div class="w-12 h-12 bg-amber-50 rounded-xl flex items-center justify-center text-amber-600 text-xl"><i class="fas fa-star"></i></div>
                    <span class="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-lg">HOT</span>
                </div>
                <h3 class="text-slate-500 text-sm font-medium mb-1">인기 테마</h3>
                <p id="popularTheme" class="text-xl font-800 text-slate-900 truncate">-</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 card-hover text-left">
                <div class="flex justify-between items-start mb-4">
                    <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-600 text-xl text-center"><i class="fas fa-check-double"></i></div>
                    <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg uppercase">Status</span>
                </div>
                <h3 class="text-slate-500 text-sm font-medium mb-1">서버 상태</h3>
                <p class="text-xl font-800 text-emerald-600">정상 작동중</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden text-left">
            <div class="px-8 py-6 border-b border-slate-50 flex items-center justify-between text-left">
                <h3 class="text-xl font-800 text-slate-900 font-impact italic uppercase">PROPOSAL ARCHIVES</h3>
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse text-left"></div>
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest text-left text-left">Real-time Feed</span>
                </div>
            </div>
            <div class="overflow-x-auto custom-scroll text-left">
                <table class="w-full text-left border-collapse text-left">
                    <thead>
                        <tr class="bg-slate-50/50 text-slate-400 text-[11px] uppercase tracking-wider font-bold text-left">
                            <th class="px-8 py-4 border-b text-left">신청 일시</th>
                            <th class="px-8 py-4 border-b text-left">지원자 정보</th>
                            <th class="px-8 py-4 border-b text-left">선택 테마</th>
                            <th class="px-8 py-4 border-b text-left">기획안 내용 (동기 및 계획)</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable" class="divide-y divide-slate-50 text-left text-left">
                        <!-- Data injected here -->
                    </tbody>
                </table>
            </div>
            <div id="loading" class="py-20 flex flex-col items-center justify-center text-slate-400 text-center">
                <div class="w-10 h-10 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin mb-4 text-center"></div>
                <p class="text-sm font-medium text-center">데이터를 불러오는 중입니다...</p>
            </div>
        </div>
    </main>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-8 right-8 hidden items-center gap-3 bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl animate-bounce text-center">
        <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center text-center">
            <i class="fas fa-bell text-center"></i>
        </div>
        <div class="text-left text-left">
            <p class="text-sm font-bold text-left">새로운 데이터 도착!</p>
            <p class="text-xs text-slate-400 text-left text-left">신청서가 실시간으로 동기화되었습니다.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 설정 (Happylife-0301)
        const firebaseConfig = {
  apiKey: "AIzaSyBCC_ZKDOKVWagnRdxyXMibEK4-tQVx5EI",
  authDomain: "happylife-0301.firebaseapp.com",
  projectId: "happylife-0301",
  storageBucket: "happylife-0301.firebasestorage.app",
  messagingSenderId: "50842617524",
  appId: "1:50842617524:web:868086900262ec9243b9e1",
  measurementId: "G-CVWZKNZ8E5"
};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'connect-2026';

        let currentProposals = [];
        let firstLoad = true;

        const init = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try { await signInWithCustomToken(auth, __initial_auth_token); } 
                    catch { await signInAnonymously(auth); }
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) { console.error("Auth failed", err); }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    document.getElementById('userDisplay').innerText = `Admin ID: ${user.uid.substring(0, 6)}`;
                    startListening();
                }
            });
        };

        function startListening() {
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'proposals'));
            onSnapshot(q, (snapshot) => {
                const items = [];
                snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                items.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                
                currentProposals = items;
                renderTable(items);
                updateStats(items);
                document.getElementById('loading').style.display = 'none';
                if (!firstLoad) showToast();
                firstLoad = false;
            }, (error) => console.error("Firestore Error:", error));
        }

        function renderTable(items) {
            const tbody = document.getElementById('dataTable');
            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-slate-400 font-bold italic">접수된 내역이 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = items.map(item => {
                const dateStr = item.timestamp ? new Date(item.timestamp.seconds * 1000).toLocaleString('ko-KR') : '-';
                return `
                    <tr class="hover:bg-indigo-50/30 transition-colors group">
                        <td class="px-8 py-5">
                            <span class="text-xs font-bold text-slate-400 block mb-1">TIME</span>
                            <span class="text-sm text-slate-600 font-bold">${dateStr}</span>
                        </td>
                        <td class="px-8 py-5 font-bold text-slate-700">${item.stuName || '익명'}</td>
                        <td class="px-8 py-5">
                            <span class="px-3 py-1 rounded-full bg-indigo-50 text-indigo-600 text-[11px] font-bold">${item.theme || '미분류'}</span>
                        </td>
                        <td class="px-8 py-5 text-left">
                            <p class="text-sm text-slate-600 whitespace-pre-wrap leading-relaxed max-w-lg">${item.content || '내용 없음'}</p>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateStats(items) {
            document.getElementById('totalCount').innerText = items.length;
            const startOfToday = new Date().setHours(0,0,0,0);
            const todayCount = items.filter(item => (item.timestamp?.seconds * 1000) >= startOfToday).length;
            document.getElementById('todayCount').innerText = todayCount;

            if (items.length > 0) {
                const counts = {};
                items.forEach(i => { if(i.theme) counts[i.theme] = (counts[i.theme] || 0) + 1; });
                const popular = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b, "-");
                document.getElementById('popularTheme').innerText = popular;
            }
        }

        window.exportToExcel = () => {
            if (currentProposals.length === 0) return alert("데이터가 없습니다.");
            const excelRows = currentProposals.map(item => ({
                "신청일시": item.timestamp ? new Date(item.timestamp.seconds * 1000).toLocaleString('ko-KR') : '-',
                "학생명": item.stuName || '익명',
                "테마": item.theme || '미분류',
                "기획내용": item.content || '-'
            }));
            const worksheet = XLSX.utils.json_to_sheet(excelRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "SupportList");
            XLSX.writeFile(workbook, `CONNECT_2026_지원현황_${new Date().toISOString().slice(0,10)}.xlsx`);
        };

        window.filterTable = () => {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const rows = document.querySelectorAll("#dataTable tr");
            rows.forEach(row => { row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none"; });
        };

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.replace('hidden', 'flex');
            setTimeout(() => toast.classList.replace('flex', 'hidden'), 3000);
        }

        init();
    </script>
</body>
</html>
